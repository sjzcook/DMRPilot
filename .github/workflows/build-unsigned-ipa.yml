name: Build unsigned iOS IPA (Xcode 27)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "DMRPilot.xcodeproj/**"
      - "DMRPilot/**"
      - ".github/workflows/build-unsigned-ipa.yml"

permissions:
  contents: read

concurrency:
  group: dmrpilot-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DMRPilot unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select and verify Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 27([.]|$)'

      - name: Show project schemes
        run: xcodebuild -list -project DMRPilot.xcodeproj

      # 工程文件是手改的 pbxproj，很容易出现「新文件没登记」或「对象 ID 撞车」。
      # 后者尤其阴：重复的 ID 只有一条生效，另一个文件会被静默排除在编译之外，
      # 最后报出来的却是别处「cannot find X in scope」，完全看不出根因。
      - name: Verify project file list
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import pathlib
          import re
          import sys

          proj_path = pathlib.Path("DMRPilot.xcodeproj/project.pbxproj")
          proj = proj_path.read_text(encoding="utf-8")

          bad = False

          # 1) 对象 ID 不能重复
          ids = re.findall(r"^\t\t([0-9A-F]{24}) ", proj, re.M)
          for oid, count in collections.Counter(ids).items():
              if count > 1:
                  print(f"::error file={proj_path}::对象 ID {oid} 定义了 {count} 次，"
                        "重复的 ID 只有一条生效，另一个文件会被静默排除")
                  bad = True

          # 2) 每个 Swift 源文件都要在工程里登记。
          #    主 App 和 Widget 扩展（Live Activity / 灵动岛）两个目录都要扫。
          SOURCE_DIRS = [pathlib.Path("DMRPilot"), pathlib.Path("DMRPilotWidget")]
          for folder in SOURCE_DIRS:
              if not folder.is_dir():
                  continue
              for swift in sorted(folder.rglob("*.swift")):
                  if f"path = {swift.name};" not in proj:
                      print(f"::error file={swift}::{swift} 没有登记进 project.pbxproj")
                      bad = True

          # 2b) C++ 与头文件也要登记。.cpp / .cc 还必须进 Sources——
          #     漏了不会报编译错误，要到链接期才炸出一堆 undefined symbol。
          for other in sorted(list(pathlib.Path("DMRPilot").rglob("*.cpp"))
                              + list(pathlib.Path("DMRPilot").rglob("*.cc"))
                              + list(pathlib.Path("DMRPilot").rglob("*.h"))):
              if f"path = {other.name};" not in proj:
                  print(f"::error file={other}::{other} 没有登记进 project.pbxproj")
                  bad = True
          for cpp in sorted(list(pathlib.Path("DMRPilot").rglob("*.cpp"))
                            + list(pathlib.Path("DMRPilot").rglob("*.cc"))):
              if f"{cpp.name} in Sources" not in proj:
                  print(f"::error file={cpp}::{cpp} 没有进 Sources 编译阶段")
                  bad = True

          # 3) build file 指向的 fileRef 必须存在
          refs = set(re.findall(r"^\t\t([0-9A-F]{24}) .*PBXFileReference", proj, re.M))
          for oid in sorted(set(re.findall(r"fileRef = ([0-9A-F]{24})", proj)) - refs):
              print(f"::error file={proj_path}::fileRef {oid} 没有对应的 PBXFileReference")
              bad = True

          # 3b) Sources 阶段引用的 buildFile 必须有定义，且它指向的文件要真的在磁盘上。
          #     删源文件时只清了 PBXFileReference、忘了清 Sources 条目，就会留下这种
          #     悬空引用 —— xcodebuild 报的是「project is damaged」或干脆静默少编一个文件，
          #     从日志里完全看不出是哪一步漏了。
          builds = set(re.findall(r"^\t\t([0-9A-F]{24}) .*isa = PBXBuildFile", proj, re.M))
          sources_block = proj.split("isa = PBXSourcesBuildPhase")[1].split(");")[0]
          source_ids = re.findall(r"^\t\t\t\t([0-9A-F]{24}) ", sources_block, re.M)
          for oid in source_ids:
              if oid not in builds:
                  print(f"::error file={proj_path}::Sources 阶段引用了不存在的 buildFile {oid}")
                  bad = True

          names = dict(re.findall(r"^\t\t([0-9A-F]{24}) /\* (.+?) \*/", proj, re.M))
          for oid, ref in re.findall(r"^\t\t([0-9A-F]{24}) /\* .+? \*/ = \{isa = PBXBuildFile; fileRef = ([0-9A-F]{24})", proj, re.M):
              name = names.get(ref, "")
              on_disk = any(list(d.rglob(name)) for d in SOURCE_DIRS if d.is_dir())
              if name.endswith((".swift", ".cpp", ".cc")) and not on_disk:
                  print(f"::error file={proj_path}::{name} 在 Sources 里，但磁盘上找不到这个文件")
                  bad = True

          # 3c) Frameworks 阶段同理：引用的 buildFile 必须有定义。
          #     另外源码里 import SQLite3 就必须把 libsqlite3.tbd 链上，
          #     漏了是链接期 undefined symbol: _sqlite3_open_v2，编译那一步查不出来。
          frameworks_block = proj.split("isa = PBXFrameworksBuildPhase")[1].split(");")[0]
          for oid in re.findall(r"^\t\t\t\t([0-9A-F]{24}) ", frameworks_block, re.M):
              if oid not in builds:
                  print(f"::error file={proj_path}::Frameworks 阶段引用了不存在的 buildFile {oid}")
                  bad = True

          imports_sqlite = any("import SQLite3" in p.read_text(encoding="utf-8", errors="ignore")
                               for p in pathlib.Path("DMRPilot").rglob("*.swift"))
          if imports_sqlite and "libsqlite3.tbd in Frameworks" not in proj:
              print(f"::error file={proj_path}::源码 import SQLite3，但工程没有链接 libsqlite3.tbd")
              bad = True

          # 4) 桥接头必须挂在 target 与 project 两份配置上，
          #    否则 Swift 看不到 C++ 接口（只在一边加会随构建方式时灵时不灵）。
          if proj.count('SWIFT_OBJC_BRIDGING_HEADER = "DMRPilot/DMRPilot-Bridging-Header.h";') < 2:
              print(f"::error file={proj_path}::SWIFT_OBJC_BRIDGING_HEADER 没有在 target 与 project 两处都设置")
              bad = True

          sys.exit(1 if bad else 0)
          PY

      - name: Archive without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project DMRPilot.xcodeproj \
            -scheme DMRPilot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/DMRPilot.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Verify widget / Live Activity wiring
        shell: bash
        run: |
          # 不设 -e：这两项缺了只是功能少一块，不应该让整包失败，但要在日志里喊出来。
          set -uo pipefail
          APP_PATH="$PWD/build/DMRPilot.xcarchive/Products/Applications/DMRPilot.app"
          echo "--- Info.plist 的实时活动开关"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP_PATH/Info.plist" \
            || echo "::warning::NSSupportsLiveActivities 没写进 Info.plist，锁定屏幕/灵动岛不会出现"
          echo "--- 嵌入的扩展"
          ls -la "$APP_PATH/PlugIns" \
            || echo "::warning::没有 PlugIns 目录：Widget 扩展没被嵌进 App"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/DMRPilot.xcarchive/Products/Applications/DMRPilot.app"
          IPA_DIR="$PWD/build/ipa"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Archived app not found at $APP_PATH"
            exit 1
          fi

          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/DMRPilot.app"
          (
            cd "$IPA_DIR"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/DMRPilot-unsigned.ipa" Payload
          )

          test -s "$GITHUB_WORKSPACE/DMRPilot-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/DMRPilot-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/DMRPilot-unsigned.ipa" \
            | tee "$GITHUB_WORKSPACE/DMRPilot-unsigned.ipa.sha256"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DMRPilot-unsigned-IPA
          path: |
            DMRPilot-unsigned.ipa
            DMRPilot-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
